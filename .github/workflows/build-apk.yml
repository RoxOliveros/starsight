name: Build StarSight APK

on:
  workflow_dispatch:
  push:
    branches:
      - chore/STAR-462-Build-Apk   # remove once merged and working

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Create .env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s\n' "$ENV_FILE" > .env

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/StarSight-latest-beta.apk

      - name: Upload APK for QA
        uses: actions/upload-artifact@v4
        with:
          name: StarSight-latest-beta
          path: build/app/outputs/flutter-apk/StarSight-latest-beta.apk
          if-no-files-found: error